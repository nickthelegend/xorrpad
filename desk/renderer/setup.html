<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xorr-pad — setup</title>
<style>
  :root {
    --bg:#000; --surface:#0C0C0D; --surface-alt:#141516; --control:#1B1C1E;
    --ink:#FFF; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.52);
    --up:#2BD87A; --up-ink:#04160C; --down:#FF453A; --line:rgba(255,255,255,.10);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:grid; place-items:center; padding:32px;
    -webkit-font-smoothing:antialiased;
  }
  main { width:100%; max-width:520px; }
  h1 { font-size:21px; font-weight:600; letter-spacing:-.01em; margin:0 0 6px; }
  .sub { color:var(--ink-3); margin:0 0 26px; font-size:13px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; }
  label { display:block; margin:0 0 18px; }
  .k { display:block; font-size:12px; color:var(--ink-2); margin-bottom:7px; font-weight:500; }
  .hint { display:block; font-size:11.5px; color:var(--ink-3); margin-top:6px; line-height:1.5; }
  input, select, textarea {
    width:100%; background:var(--control); color:var(--ink); font:inherit;
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:rgba(43,216,122,.55); }
  input::placeholder { color:rgba(255,255,255,.28); }
  .row { display:flex; gap:10px; align-items:center; margin-top:4px; }
  button {
    background:var(--up); color:var(--up-ink); font:inherit; font-weight:600;
    border:0; border-radius:9px; padding:10px 18px; cursor:pointer;
  }
  button.ghost { background:var(--control); color:var(--ink-2); font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  #msg { margin-top:14px; font-size:12.5px; min-height:18px; }
  #msg.bad { color:var(--down); }
  #msg.good { color:var(--up); }
  a { color:var(--ink-2); }
  :focus-visible { outline:2px solid var(--up); outline-offset:3px; }
  textarea { min-height:160px; resize:vertical; }
  .row { flex-wrap:wrap; }
  #agentMsg { overflow-wrap:anywhere; }
  @media(max-width:600px) { body {padding:20px; display:block;} input,select,textarea {font-size:16px;} }

</style>

<main>
  <h1>Set up xorr-pad</h1>
  <p class="sub">
    Keys are encrypted with your system keychain. Audio goes to Deepgram; chat goes to your chosen model provider.
  </p>

  <div class="card">
    <label>
      <span class="k">Deepgram API key</span>
      <input id="deepgram" type="password" autocomplete="off" spellcheck="false"
             placeholder="required for the mic and the spoken replies">
      <span class="hint">
        Speech in and out. Without it the desk still trades — every key, every
        verdict, every fill — but the mic key and spoken answers do not work.
        Free key at <a href="https://console.deepgram.com" target="_blank" rel="noreferrer">console.deepgram.com</a>.
      </span>
    </label>

    <label>
      <span class="k">Pad token</span>
      <input id="token" autocomplete="off" spellcheck="false" value="xorrpad-dev">
      <span class="hint">
        The shared secret the physical pad sends on every request. Type the same
        value into the pad's captive portal. Leave it as-is if you have no pad.
      </span>
    </label>

    <label>
      <span class="k">Chain</span>
      <select id="chainMode">
        <option value="solana">Solana — external wallet signing</option>
      </select>
      <span class="hint">
        The desk builds unsigned transactions. Sign on your own wallet;
        the desk never holds a signing key.
      </span>
    </label>

    <div class="row">
      <button id="save">Save and open the desk</button>
      <button id="skip" class="ghost">Skip for now</button>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <hr>
    <h2>Models &amp; keys</h2>
    <p class="hint">Open the desk first to manage your model settings.</p>
    <label><span class="k">Provider</span><select id="provider"><option value="ollama">Ollama</option><option value="anthropic">Anthropic</option><option value="openai">OpenAI-compatible / OpenRouter</option></select></label>
    <label><span class="k">Base URL</span><input id="baseUrl" type="url" value="http://localhost:11434" spellcheck="false"></label>
    <label><span class="k">Model</span><input id="model" list="models" spellcheck="false"><datalist id="models"></datalist></label>
    <div class="row"><button id="loadModels" class="ghost">Load models</button><button id="saveModel">Save model</button></div>
    <label><span class="k">Key provider</span><select id="keyProvider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI-compatible</option><option value="deepgram">Deepgram</option><option value="tailscale">Tailscale</option><option value="groq">Groq fallback</option></select></label>
    <label><span class="k">API key (blank removes it)</span><input id="apiKey" type="password" autocomplete="off"></label>
    <button id="saveKey">Save key</button>
    <p id="keyStatus" class="hint"></p>
    <h2>xorr's voice</h2>
    <label><span class="k">Persona</span><textarea id="persona" maxlength="8000" aria-describedby="personaHint"></textarea><span id="personaHint" class="hint">Edit the style. Exact numbers, risks, venues and signature checks always apply.</span></label>
    <div class="row"><button id="savePersona">Save persona</button><button id="resetPersona" class="ghost">Reset to default</button></div>
    <div id="agentMsg" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const msg = $("msg");
  const authToken = new URLSearchParams(location.search).get('token') || localStorage.getItem('pad-token') || '';
  if(authToken)$('token').value=authToken;
  async function agentRequest(route,body) {
    const r = await fetch(route,{method:body?'POST':'GET',headers:{authorization:'Bearer '+authToken,'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP '+r.status); return j;
  }
  const defaults = {ollama:['http://localhost:11434',''],anthropic:['https://api.anthropic.com/v1','claude-haiku-5-5'],openai:['https://openrouter.ai/api/v1','']};
  $('provider').onchange = () => {[$('baseUrl').value,$('model').value] = defaults[$('provider').value];};
  const modelConfig = () => ({provider:$('provider').value,baseUrl:$('baseUrl').value,model:$('model').value});
  async function action(button, fn) {
    button.disabled=true; $('agentMsg').textContent='Working…';
    try { await fn(); $('agentMsg').textContent='Saved.'; }
    catch(e) {$('agentMsg').textContent=e.message;} finally {button.disabled=false;}
  }
  $('saveModel').onclick = () => action($('saveModel'),() => agentRequest('/agent/settings',modelConfig()));
  $('loadModels').onclick = () => action($('loadModels'),async () => {
    const rows = await agentRequest('/agent/models?'+new URLSearchParams(modelConfig()));
    $('models').replaceChildren(...rows.map(row => {const o=document.createElement('option');o.value=row.id;return o;}));
    if (!$('model').value && rows.length) $('model').value=rows[0].id;
  });
  $('savePersona').onclick = () => action($('savePersona'),() => agentRequest('/agent/settings',{persona:$('persona').value}));
  $('resetPersona').onclick = () => action($('resetPersona'),async () => {$('persona').value=(await agentRequest('/agent/settings',{resetPersona:true})).persona;});
  $('saveKey').onclick = () => action($('saveKey'),async () => {
    const j=await agentRequest('/agent/keys',{provider:$('keyProvider').value,key:$('apiKey').value});
    $('apiKey').value=''; $('keyStatus').textContent=j.provider+': '+(j.key || 'Setup required: API key');
  });
  if (authToken) agentRequest('/agent/settings').then(j => {
    for(const k of ['provider','baseUrl','model','persona']) $(k).value=j[k];
    $('keyStatus').textContent=Object.entries(j.keys).map(([k,v]) => k+': '+(v || 'not configured')).join(' · ');
  }).catch(e => {$('agentMsg').textContent=e.message;});

  async function save() {
    $("save").disabled = true;
    msg.className = ""; msg.textContent = "Saving…";
    try {
      const r = await fetch("/setup", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          deepgram: $("deepgram").value,
          token: $("token").value,
        }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
      msg.className = "good";
      msg.textContent = "Saved " + j.saved.join(", ") + ". Opening the desk…";
      // Redirect with the token the SERVER says is in force, never the field.
      // Leaving the field blank means "keep the current one", and using the
      // blank here opened the desk at ?token= — every pane empty, locked out.
      const tok = j.token || $("token").value;
      // The key is live immediately — credentials are read at call time, so no
      // restart is needed.
      setTimeout(() => { location.href = "/?token=" + encodeURIComponent(tok); }, 700);
    } catch (e) {
      msg.className = "bad";
      msg.textContent = String(e.message || e);
      $("save").disabled = false;
    }
  }

  $("save").addEventListener("click", save);
  $("skip").addEventListener("click", async () => {
    // Same trap as Save: a blank field must not become the URL's token.
    let tok = authToken || $("token").value;
    if (!tok) {
      try { tok = (await (await fetch("/setup", { method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: $("token").value }) })).json()).token || ""; } catch { /* keep blank */ }
    }
    location.href = "/?token=" + encodeURIComponent(tok);
  });
  $("deepgram").addEventListener("keydown", (e) => { if (e.key === "Enter") save(); });
</script>
