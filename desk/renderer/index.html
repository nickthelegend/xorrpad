<!doctype html>
<html lang="en" data-theme="floor">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>XOR / Desk</title>
    <link rel="stylesheet" href="/ui/desk.css" />
    <script type="module" src="/ui/app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to workspace</a>
    <div class="shell">
      <aside id="rail">
        <a class="brand" href="#pad"
          ><span class="mark" aria-hidden="true">X</span
          ><span>XOR<span class="eyebrow">DESK / V1.0.0</span></span></a
        >
        <div class="rail-label">WORKSPACE</div>
        <nav aria-label="Workspace" id="navigation"></nav>
        <div class="rail-bottom">
          <label
            >Appearance<select id="theme">
              <option value="floor">Floor</option>
              <option value="paper">Paper</option>
              <option value="neon">Neon</option>
            </select></label
          ><a href="/classic" id="classic">↗ Classic desk</a
          ><button id="panic" class="danger">Disarm all trading</button
          ><small>One pad. Every venue.</small>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button
            id="menu"
            aria-expanded="false"
            aria-controls="rail"
            aria-label="Toggle navigation"
          >
            ☰</button
          ><span class="breadcrumb"
            >WORKSPACE <span>/</span> <b id="crumb">Pad</b></span
          ><span id="connection" class="status">Disconnected</span
          ><button id="connect">Connect desk</button>
        </header>
        <main id="content" tabindex="-1"></main>
        <footer>
          <span>XOR / SOLANA WORKSPACE</span
          ><span>Phone wallet signing by default</span>
        </footer>
      </div>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="auth">
      <form id="auth-form">
        <span class="eyebrow">DESK CONNECTION</span>
        <h2>Connect your workspace</h2>
        <p>Use the pad token configured on the machine running this desk.</p>
        <label
          >Pad token<input
            id="token"
            type="password"
            autocomplete="off"
            required
        /></label>
        <div class="actions">
          <button type="button" id="cancel-auth">Cancel</button
          ><button class="primary">Connect</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
